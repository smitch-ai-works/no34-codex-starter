<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>制作タスク | Reel Desk</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f6;color:#243140;font-family:'Yu Gothic',sans-serif}header{height:76px;background:white;border-bottom:1px solid #dfe5e8;display:flex;align-items:center;justify-content:space-between;padding:0 45px}b.brand{font-size:24px}b.brand span{color:#368f80}.badge{font-size:14px;background:#eef7f3;color:#277963;border-radius:16px;padding:8px 16px}.wrap{display:grid;grid-template-columns:225px 1fr;min-height:724px}aside{background:#fcfdfd;padding:32px 22px;line-height:3;color:#718090}.selected{background:#e0f0ea;color:#24745c;border-radius:12px;padding-left:15px;font-weight:bold}main{padding:35px 48px}.eyebrow{font-size:13px;color:#83909a;letter-spacing:2px}h1{font-size:32px;margin:8px 0 6px}.sub{font-size:15px;color:#75818a}.stats{display:flex;gap:20px;margin:27px 0}.stat{background:white;border-radius:16px;padding:17px 25px;flex:1;border:1px solid #e1e8e7}.number{font-size:34px;font-weight:bold;color:#2f8b73}.stat small{color:#78828b}.panel{background:white;border-radius:18px;padding:24px;border:1px solid #e1e8e7}h2{font-size:19px;margin:0 0 18px}.task{display:flex;align-items:center;padding:17px 5px;border-bottom:1px solid #edf0f2;gap:17px;transition:background .2s}.task.done{background:#f1faf5}.check{width:26px;height:26px;accent-color:#29916e;cursor:pointer}.task label{font-size:18px;flex:1}.tag{font-size:12px;border-radius:6px;padding:5px 9px;background:#eef1fb;color:#5d6bad}.done label{text-decoration:line-through;color:#81958a}.bar{height:8px;background:#e9efec;border-radius:8px;margin-top:13px;overflow:hidden}.fill{height:100%;width:0;background:#38a17b;transition:width .4s}form{display:flex;gap:10px;margin-top:19px}input[type=text]{flex:1;border:1px solid #dbe3e3;padding:12px;border-radius:8px;font-size:15px}button{background:#2c816b;border:0;color:white;border-radius:8px;padding:10px 20px;font-weight:bold;cursor:pointer}footer{font-size:12px;color:#8b969d;margin-top:18px}
</style><header><b class="brand">▥ Reel <span>Desk</span></b><span class="badge">制作ワークスペース</span></header><div class="wrap"><aside><div class="selected">▦ ダッシュボード</div><div>　☑ 制作タスク</div><div>　▤ 素材ライブラリ</div><div>　◷ スケジュール</div></aside><main><div class="eyebrow">CREATOR WORKSPACE</div><h1>今日の制作を、ひとつずつ。</h1><div class="sub">動画づくりの進み具合をひと目でチェック。</div><div class="stats"><div class="stat"><small>制作タスク</small><div class="number" id="total">4</div></div><div class="stat"><small>完了したタスク</small><div class="number" id="complete">0</div></div><div class="stat"><small>今日の進捗</small><div class="number" id="rate">0%</div></div></div><div class="panel"><h2>リール制作チェックリスト</h2><div id="tasks"></div><div class="bar"><div class="fill"></div></div><form><input type="text" placeholder="新しいタスクを追加" aria-label="新しいタスク"><button>追加</button></form></div><footer>この撮影用に制作した、実際に操作できるローカルツール。</footer></main></div><script>
const list=document.querySelector('#tasks'),key='codex-starter-tasks-v1';let data;try{data=JSON.parse(localStorage.getItem(key))}catch(e){}if(!Array.isArray(data))data=['台本を確認する','挿入素材を集める','動画を編集する','書き出しを確認する'].map(text=>({text,done:false}));
function render(){list.replaceChildren();data.forEach((item,i)=>{const row=document.createElement('div');row.className='task'+(item.done?' done':'');const c=document.createElement('input');c.type='checkbox';c.className='check';c.checked=item.done;c.setAttribute('aria-label',item.text+'を完了');c.onchange=()=>{item.done=c.checked;render()};const label=document.createElement('label');label.textContent=item.text;label.onclick=()=>{item.done=!item.done;render()};const del=document.createElement('button');del.type='button';del.textContent='削除';del.setAttribute('aria-label',item.text+'を削除');del.onclick=()=>{if(confirm('このタスクを削除しますか？')){data.splice(i,1);render()}};row.append(c,label,del);list.append(row)});const n=data.filter(x=>x.done).length;document.querySelector('#total').textContent=data.length;document.querySelector('#complete').textContent=n;document.querySelector('#rate').textContent=(data.length?Math.round(n/data.length*100):0)+'%';document.querySelector('.fill').style.width=document.querySelector('#rate').textContent;try{localStorage.setItem(key,JSON.stringify(data))}catch(e){document.querySelector('footer').textContent='このブラウザでは保存が使えません。ページを閉じる前に内容を控えてください。'}}
document.querySelector('form').onsubmit=e=>{e.preventDefault();const i=document.querySelector('input[type=text]');if(i.value.trim()){data.push({text:i.value.trim(),done:false});i.value='';render()}};render();
</script><style>.task button{font-size:12px;padding:9px 10px;background:#edf1f4;color:#60717a}.task label{min-width:0;overflow-wrap:anywhere}input[type=text]{min-width:0}.stats .stat{min-width:0}@media(max-width:650px){header{padding:0 20px}.badge{font-size:10px}.wrap{display:block}aside{display:none}main{padding:24px 18px}h1{font-size:24px}.stats{gap:8px}.stat{padding:12px}.stat small{font-size:10px}.number{font-size:26px}.panel{padding:16px}.task{gap:10px}.task label{font-size:15px}form{gap:6px}form button{padding:10px 12px}}</style></html>
